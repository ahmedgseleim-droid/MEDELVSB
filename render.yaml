services:
  - type: web
    name: medel-samba2-tracker
    runtime: node
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter @workspace/samba2-tracker run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/db run push && node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: medel-samba2-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        value: MEDEL@VSB

databases:
  - name: medel-samba2-db
    databaseName: medel_samba2
    user: medel_user
    plan: free
